<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月喵 · 视觉方向原型（月夜玻璃 · PROTOTYPE — 抛弃式）</title>
<style>
/* ============================================================
   月喵 视觉方向原型（throwaway — 已定稿：月夜玻璃）
   - 流程：落地页 → 登录窗（morph）→ 外壳 → 帖子列表
   - 标题栏 icon-first：导航只留图标（aria-label + tooltip），月喵放大居中
   - 状态只存内存，无持久化。不是生产代码。
   ============================================================ */

:root {
  --bg: #0b0e18;
  --bg-grad-a: #0b0e18;
  --bg-grad-b: #151a2c;
  --panel: rgba(255, 255, 255, 0.055);
  --panel-solid: #151a2c;
  --border: rgba(255, 255, 255, 0.12);
  --text: #eef2ff;
  --text-dim: #98a1c4;
  --accent: #00a1d6;
  --accent-ink: #04141b;
  --accent-2: #fb7299;
  --ok: #3ddc97;
  --danger: #ff5c5c;
  --radius: 20px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  --glow-a: rgba(0, 161, 214, 0.5);
  --glow-b: rgba(251, 114, 153, 0.4);
  --glass-blur: 14px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.55;
}

body {
  color: var(--text);
  background:
    radial-gradient(1200px 700px at 80% -10%, var(--glow-a), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, var(--glow-b), transparent 60%),
    linear-gradient(160deg, var(--bg-grad-a), var(--bg-grad-b));
  background-attachment: fixed;
}

#app { min-height: 100vh; }

a { color: var(--accent); }

/* ---------- 通用控件 ---------- */
button {
  font: inherit;
  color: var(--text);
  background: var(--panel-solid);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
}

input {
  font: inherit;
  color: var(--text);
  background: var(--panel-solid);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  width: 100%;
}
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent); }

button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.ic { display: block; }

/* icon-first 按钮：只有图标 → aria-label + data-tip */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 6px; color: var(--text-dim);
  background: transparent; border: 1px solid transparent;
  border-radius: var(--radius-pill); text-decoration: none; line-height: 0;
}
.icon-btn:hover { color: var(--text); border-color: var(--border); }

.round-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0; border-radius: 50%;
  border: 1px solid var(--border); background: color-mix(in srgb, var(--panel-solid) 60%, transparent);
  color: var(--text-dim); text-decoration: none; line-height: 0;
}
.round-btn:hover { color: var(--text); border-color: var(--accent); }

/* 头像兜底：昵称首字 + 主题色圆底 */
.avatar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 14px; flex: none;
}

/* 轻量 tooltip（icon-first 的说明落点；可访问名始终由 aria-label 承担） */
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%);
  background: #0a0a0f; color: #fff; padding: 4px 8px; border-radius: 6px;
  font-size: 12px; white-space: nowrap; z-index: 999; pointer-events: none;
}

/* ============================================================
   落地页
   ============================================================ */
.landing { min-height: 100vh; display: flex; flex-direction: column; padding: 18px 20px 28px; }
.landing-top { display: flex; justify-content: flex-end; gap: 8px; }
.landing-stage {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding-top: clamp(24px, 14vh, 140px); gap: 20px;
}
.hero-head {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px;
  transition: transform 0.46s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.46s ease;
}
.hero-motion {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(560px, 86vw); height: min(440px, 58vh);
  background:
    radial-gradient(circle at 30% 30%, var(--glow-a), transparent 55%),
    radial-gradient(circle at 70% 65%, var(--glow-b), transparent 55%);
  filter: blur(34px); opacity: 0.55; z-index: 0; pointer-events: none;
  animation: hero-drift 9s ease-in-out infinite alternate;
}
@keyframes hero-drift {
  from { transform: translate(-50%, -50%) translate3d(-14px, -8px, 0) scale(1); }
  to   { transform: translate(-50%, -50%) translate3d(14px, 10px, 0) scale(1.06); }
}
.moon-title {
  position: relative; z-index: 1; margin: 0;
  font-size: clamp(56px, 13vw, 108px); line-height: 1.05; letter-spacing: 0.06em;
  text-shadow: 0 6px 30px var(--glow-a);
}
.tagline { position: relative; z-index: 1; margin: 0; font-size: 13px; letter-spacing: 0.08em; color: var(--text-dim); }

.morph { position: relative; width: min(440px, 100%); display: flex; justify-content: center; min-height: 56px; }

button.start {
  align-self: center; display: inline-flex; align-items: center; justify-content: center;
  min-width: 168px; padding: 14px 46px; border-radius: var(--radius-pill);
  background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink);
  font-size: 18px; font-weight: 700; letter-spacing: 0.16em;
  transition: opacity 0.42s ease 0.24s, transform 0.32s ease;
}
button.start:hover { transform: translateY(-1px); }

.auth-window {
  position: absolute; top: 0; left: 50%; width: 100%; padding: 16px;
  border-radius: var(--radius); border: 1px solid var(--border);
  background: color-mix(in srgb, var(--panel-solid) 72%, transparent);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--shadow);
  transform: translateX(-50%) scale(0.5); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform 0.44s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.3s ease, border-radius 0.44s ease, visibility 0s linear 0.44s;
}

.window-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.window-title { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
.auth-form { display: flex; flex-direction: column; gap: 10px; }
.auth-form label { font-size: 12px; color: var(--text-dim); }
.auth-form button.primary { width: 100%; }
.direct { margin-top: 10px; width: 100%; background: transparent; border-color: var(--border); color: var(--text-dim); }
.direct:hover { color: var(--text); border-color: var(--accent); }

/* 阶段切换（morph） */
#app[data-stage="auth"] .hero-head { transform: translateY(-clamp(48px, 18vh, 190px)) scale(0.34); opacity: 0.16; }
#app[data-stage="auth"] .auth-window {
  transform: translateX(-50%) scale(1); opacity: 0.96; visibility: visible; pointer-events: auto;
  transition: transform 0.44s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.34s ease 0.12s, border-radius 0.44s ease, visibility 0s linear 0s;
}
#app[data-stage="auth"] button.start { opacity: 0; }
#app[data-stage="auth"] .chev { opacity: 0; }

.chev { font-size: 22px; line-height: 1; color: var(--text-dim); animation: chev-float 1.5s ease-in-out infinite alternate; }
@keyframes chev-float { from { transform: translateY(-5px); } to { transform: translateY(4px); } }

.landing-foot { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 0; color: var(--text-dim); font-size: 12px; text-align: center; }

/* ============================================================
   外壳（月夜玻璃：图标标题栏 + 帖子 + FAB）
   ============================================================ */
.shell { display: none; }
#app[data-stage="shell"] .shell { display: block; }
#app[data-stage="shell"] .landing { display: none; }

.shell-inner { max-width: 1080px; margin: 0 auto; padding: 18px 20px 96px; }

.bar {
  position: sticky; top: 12px; z-index: 10;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px; border-radius: var(--radius);
  background: color-mix(in srgb, var(--panel-solid) 72%, transparent);
  backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--border);
}

/* 月喵：放大 1.5 倍（16px → 24px），居中 */
.brand {
  order: 2; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 24px; text-decoration: none; color: var(--text);
}

/* icon-first 分区导航：只有图标，无文字（aria-label + tooltip） */
.zones { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.zones-left { order: 1; flex: 1; justify-content: flex-end; }
.zones-right { order: 3; flex: 1; justify-content: flex-start; }

.zone-pill {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0; border-radius: 50%;
  border: 1px solid transparent; color: var(--text-dim);
  text-decoration: none; line-height: 0;
}
.zone-pill:hover { color: var(--text); border-color: var(--border); }
.zone-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* FAB（右下浮动） */
.fab { position: fixed; right: 22px; bottom: 84px; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fab-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; padding: 0; border-radius: 50%;
  background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink);
}
.fab-actions { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transform: translateY(6px) scale(0.94); visibility: hidden; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease; }
.fab.expanded .fab-actions { opacity: 1; transform: none; visibility: visible; pointer-events: auto; }
.fab-action {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; padding: 0; border-radius: 50%;
  background: var(--panel-solid); border: 1px solid var(--border); color: var(--text);
}
.fab-action:hover { border-color: var(--accent); color: var(--accent); }

/* 帖子流 */
.section-head { display: flex; align-items: center; gap: 8px; margin: 18px 0 14px; }
.section-head h2 { margin: 0; font-size: 16px; }

.feed { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .feed { grid-template-columns: minmax(0, 1fr); } }

.post { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border); background: color-mix(in srgb, var(--panel-solid) 72%, transparent); backdrop-filter: blur(var(--glass-blur)); }
.post-head { display: flex; align-items: center; gap: 10px; }
.post-avatar { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.post-meta { display: flex; flex-direction: column; min-width: 0; }
.post-author { font-weight: 600; }
.post-time { font-size: 12px; color: var(--text-dim); }
.post-text { margin: 0; }
.post-media { display: flex; align-items: center; justify-content: center; height: 120px; border-radius: var(--radius-sm); color: var(--text-dim); font-size: 12px; background: linear-gradient(135deg, var(--glow-a), var(--glow-b)); opacity: 0.9; }
.post-actions { display: flex; gap: 14px; }
.post-stat { display: inline-flex; align-items: center; gap: 5px; color: var(--text-dim); font-size: 12px; }

/* ============================================================
   原型 chrome（非设计本身）
   ============================================================ */
.meta {
  position: fixed; bottom: 16px; left: 12px; z-index: 50;
  display: flex; flex-direction: column; gap: 6px; pointer-events: none;
}
.meta-badge {
  align-self: flex-start; padding: 3px 9px; border-radius: 6px;
  background: #ff5c5c; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
}
.meta-line {
  align-self: flex-start; padding: 3px 9px; border-radius: 6px;
  background: rgba(0, 0, 0, 0.7); color: #d8dde8; font-size: 11px;
  font-family: 'Cascadia Mono', Consolas, monospace;
}

/* 降级：系统要求减少动效 */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

          <button type="button" class="fab-action" aria-label="新建房间" data-tip="新建房间"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
          <button type="button" class="fab-action" aria-label="发送帖子" data-tip="发送帖子"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
          <button type="button" class="fab-action" aria-label="添加番剧" data-tip="添加番剧"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- 原型 meta（非设计本身） -->
<div class="meta">
  <span class="meta-badge">PROTOTYPE · 抛弃式</span>
  <span class="meta-line" id="state-line">stage=landing motion=on</span>
</div>

<script>
(function () {
  'use strict'

  var STAGES = { landing: '落地页', auth: '登录窗', shell: '外壳/帖子' }
  var app = document.getElementById('app')
  var stateLine = document.getElementById('state-line')

  // ---------- 帖子占位数据（假数据，图片槽位用渐变占位） ----------
  var POSTS = [
    { author: '月夜猫', char: '月', color: '#00a1d6', time: '2 分钟前', text: '今晚 8 点一起补《葬送的芙莉莲》第 4 集，房间码 MOON04，来的人发个爪。', img: true, likes: 23, comments: 7 },
    { author: '放映员', char: '放', color: '#fb7299', time: '18 分钟前', text: '把「一起看」的卡顿换父逻辑又调了一版，现在切主播放器基本无感了。', img: false, likes: 41, comments: 12 },
    { author: '阿梓', char: '阿', color: '#8b7bf0', time: '1 小时前', text: '求一个能一起看老番的房，最好带弹幕节奏……', img: false, likes: 9, comments: 3 },
    { author: '夜猫子', char: '夜', color: '#3ddc97', time: '2 小时前', text: '今晚的片单：吉卜力连播。房间码 GHIBLI，静音党勿入。', img: true, likes: 57, comments: 15 },
    { author: '喵喵', char: '喵', color: '#f5c76a', time: '昨天', text: '月喵的动效真顺滑，morph 变形那一下每次看都觉得治愈。', img: false, likes: 18, comments: 5 }
  ]

  var ICONS = {
    heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
    comment: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'
  }

  function svg(name, size) {
    return '<svg class="ic" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'
  }

  function postHTML(p) {
    var media = p.img ? '<div class="post-media">动图槽位（占位）</div>' : ''
    return (
      '<article class="post">' +
        '<div class="post-head">' +
          '<span class="post-avatar" style="background:' + p.color + '">' + p.char + '</span>' +
          '<div class="post-meta"><span class="post-author">' + p.author + '</span><span class="post-time">' + p.time + '</span></div>' +
        '</div>' +
        '<p class="post-text">' + p.text + '</p>' +
        media +
        '<div class="post-actions">' +
          '<span class="post-stat">' + svg('heart', 14) + p.likes + '</span>' +
          '<span class="post-stat">' + svg('comment', 14) + p.comments + '</span>' +
        '</div>' +
      '</article>'
    )
  }

  function renderPosts() {
    document.getElementById('feed').innerHTML = POSTS.map(postHTML).join('')
  }

  // ---------- 阶段状态 ----------
  function setStage(stage) {
    app.dataset.stage = stage
    var win = document.getElementById('auth-window')
    var start = document.getElementById('start-btn')
    if (stage === 'auth') {
      win.setAttribute('aria-hidden', 'false')
      start.setAttribute('aria-expanded', 'true')
    } else {
      win.setAttribute('aria-hidden', 'true')
      start.setAttribute('aria-expanded', 'false')
    }
    renderState()
  }

  function enterShell() {
    setStage('shell')
    window.scrollTo(0, 0)
  }

  // 深链：?stage=landing|auth|shell 可直接跳到某阶段。
  function stageFromURL() {
    var m = /[?&]stage=(landing|auth|shell)/.exec(location.search)
    return m ? m[1] : 'landing'
  }

  function reducedMotion() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches
  }

  function renderState() {
    var s = app.dataset.stage
    var motion = reducedMotion() ? 'off' : 'on'
    stateLine.textContent = 'stage=' + s + ' (' + STAGES[s] + ')  motion=' + motion
  }

  // ---------- 事件 ----------
  document.getElementById('start-btn').addEventListener('click', function () {
    setStage(app.dataset.stage === 'auth' ? 'landing' : 'auth')
  })

  document.getElementById('auth-close').addEventListener('click', function () { setStage('landing') })

  document.getElementById('auth-form').addEventListener('submit', function (e) { e.preventDefault(); enterShell() })

  document.getElementById('direct-entry').addEventListener('click', enterShell)

  document.querySelectorAll('.fab-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var fab = btn.closest('.fab')
      var expanded = fab.classList.toggle('expanded')
      btn.setAttribute('aria-expanded', expanded ? 'true' : 'false')
    })
  })

  if (window.matchMedia) {
    window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', renderState)
  }

  // ---------- 启动 ----------
  renderPosts()
  setStage(stageFromURL())
})()
</script>
</body>
</html>
