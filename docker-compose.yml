# ProjectionRoom 生产部署（Docker Compose）
#
# 两种用法：
#   A. CI 部署（推荐）：镜像由 GitHub Actions 构建推到 GHCR，
#      部署时通过 `IMAGE_REF` 环境变量指定具体标签（按提交号精确回滚）：
#        IMAGE_REF=ghcr.io/drayee/projectionroom:abc1234 docker compose up -d
#   B. 本地构建：不传 IMAGE_REF 时回落到 `build:` 分支自行构建。
#
# ⚠ 数据库不放在 compose 里：本机已有 PostgreSQL 16（回环 5432）且存着生产数据，
#    再起一个 pg 容器会争抢 5432 端口并让"数据在哪"变成两个答案。
#    app 通过 host.docker.internal 访问宿主机数据库（见下方 extra_hosts）。

services:
  app:
    image: ${IMAGE_REF:-projectionroom:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectionroom-app
    restart: unless-stopped
    env_file:
      - .env
    # 让容器内的 127.0.0.1 指向宿主机，从而复用宿主机上的 PostgreSQL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 只绑回环：公网流量一律经 nginx 进来（与裸机部署时的口径一致）
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # 服务器只有 1.6 GiB 内存，且 PG/nginx 也在上面跑
          memory: 700M
