# GitHub Actions: 部署到生产服务器（60.205.212.25）
#
# 前置条件（缺任一项都会失败）：
#  1. Secret `REGISTRY_TOKEN`  —— 登录 GHCR 拉镜像（与 build-push 共用）
#  2. Secret `SSH_PRIVATE_KEY` —— 部署私钥（**必须是完整 PEM/OpenSSH 私钥**，
#     含 `-----BEGIN ... PRIVATE KEY-----` 与 `-----END ...-----` 两行）
#     或 Secret `SSH_PASSWORD`  —— 密码认证（备选）
#
# 设计取舍：
#  - **不在 runner 上编译**：镜像已由 build-push 构建推到 GHCR，这里只负责
#    "让服务器换成那个镜像"。runner 上重复编译既慢又容易版本漂移。
#  - **按 sha 精确部署**：用提交号作标签，回滚就是再跑一次旧 sha。
#  - **部署后必须过健康检查**：拉起来不算成功，/healthz 返回 200 才算。
#  - **认证方式靠实测决定，不靠"Secret 非空"**：
#    踩过的坑 —— 只要 SSH_PRIVATE_KEY 有内容就走 key 分支，哪怕内容是密码或
#    残缺私钥（症状是 `error in libcrypto` + `Permission denied`），
#    而密码分支永远被跳过。现在先用私钥**真跑一次 `ssh true`**，失败才回退。
#  - **不 `docker compose down`**：down 会让服务空窗几秒。`up -d` 自带
#    重建语义（镜像变了就换容器），nginx 与用户侧无感。

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像标签（默认 latest；建议填提交号前 7 位）'
        required: false
        default: 'latest'
  workflow_run:
    workflows: ["Build & Push Docker Image"]
    types: [completed]
    branches: [master, main]

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST || '60.205.212.25' }}
  SERVER_USER: root
  DEPLOY_PATH: /opt/projectionroom
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/drayee/projectionroom

# ⚠ 同一时间只允许一个部署在跑。
#
# 踩过的现场：build-push 与 deploy 都由 push 触发，而我连着推了两次提交，
# 于是**两个 deploy 并行**（09:40 与 09:41 各一个）。两个都在远程执行
# `sed -i IMAGE_REF=...` 和 `docker compose up -d`，结果后完成的那个
# 把 IMAGE_REF 覆盖成自己的值 —— 最终容器跑的版本与最后一次提交不一致，
# 而两个 run 都显示 success。这种"双绿但状态错"比直接失败难查得多。
#
# cancel-in-progress: false 而不是 true：**不能**取消正在进行的部署。
# 取消可能停在"镜像已 pull、容器还没 up"的中间态，那比串行等更糟。
# 串行 + 排队让每次部署完整走完，最后一次提交的部署最终胜出。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 整条 job 的硬上限。远程拉镜像最多等 15 分钟，健康检查最多 60 秒，
    # 加上 checkout/探测的开销，25 分钟足够；超过说明卡死了，让它失败而不是挂到 6 小时。
    timeout-minutes: 25
    # 只在构建成功时自动部署；手动触发不受此限
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show target
        run: |
          echo "server = ${{ env.SERVER_HOST }}"
          echo "image  = ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"

      - name: Probe SSH authentication
        id: probe
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ env.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          METHOD=none

          # —— 先试私钥 ——
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key

            # 关键：先看它是不是一个**结构完整**的私钥，再实际握手。
            # 只看"Secret 非空"是不够的 —— 那是上一次失败的原因。
            if ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
              echo "私钥格式有效，尝试握手…"
              if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
                     "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" true 2>/dev/null; then
                echo "私钥认证成功"
                METHOD=key
              else
                echo "::warning::私钥有效但服务器拒绝（公钥未装进 authorized_keys？）"
              fi
            else
              echo "::warning::SSH_PRIVATE_KEY 不是有效的私钥（缺 BEGIN/END 行，或填成了密码）"
            fi
          else
            echo "未配置 SSH_PRIVATE_KEY"
          fi

          # —— 私钥不可用则回退密码 ——
          if [ "$METHOD" = "none" ] && [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "回退到密码认证"
            METHOD=password
          fi

          if [ "$METHOD" = "none" ]; then
            echo "::error::没有任何可用的 SSH 认证方式。请在仓库 Secrets 里配置 SSH_PRIVATE_KEY（完整私钥）或 SSH_PASSWORD。"
            exit 1
          fi

          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
          echo "选用认证方式：$METHOD"

      - name: Install sshpass (password fallback only)
        if: steps.probe.outputs.method == 'password'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      # 从构建工作流取回切片器二进制，传进服务器再导入 MinIO。
      #
      # 为什么不直接在 CI 里连 MinIO：它只监听回环（安全考虑），runner 连不上。
      # 绕法是把文件交给本步骤，由它在服务器本地执行 mc cp —— 这样
      # 既保持了 MinIO 不对公网暴露，又不需要为 CI 单独开一个端口。
      - name: Download segmenter artifacts
        uses: actions/download-artifact@v4
        with:
          name: segmenter-binaries
          path: segmenter-out
        continue-on-error: true   # 没有 artifact 时（旧 run / 手动触发）跳过即可

      - name: Publish segmenter to MinIO on server
        env:
          METHOD: ${{ steps.probe.outputs.method }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          # 没有 artifact 就跳过（手动触发部署、或构建未产出时）
          if ! ls segmenter-out/segmenter-* >/dev/null 2>&1; then
            echo "没有 segmenter artifact，跳过发布"
            exit 0
          fi

          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=20
                    -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          if [ "$METHOD" = "key" ]; then
            SSH_CMD=(ssh -i ~/.ssh/deploy_key "${SSH_OPTS[@]}"
                     "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}")
            SCP_CMD=(scp -i ~/.ssh/deploy_key "${SSH_OPTS[@]}")
          else
            SSH_CMD=(sshpass -p "$SSH_PASSWORD" ssh "${SSH_OPTS[@]}"
                     "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}")
            SCP_CMD=(sshpass -p "$SSH_PASSWORD" scp "${SSH_OPTS[@]}")
          fi

          # 先把二进制传到服务器（82MB，走 SCP）
          "${SSH_CMD[@]}" "mkdir -p /tmp/pr-segmenter && rm -f /tmp/pr-segmenter/*"
          echo "上传二进制到服务器…"
          "${SCP_CMD[@]}" segmenter-out/segmenter-* \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/pr-segmenter/"

          # 上传发布脚本（在服务器上执行，避免 heredoc 里嵌 python 的多层引号问题）
          "${SCP_CMD[@]}" scripts/publish-segmenter.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/publish-segmenter.sh"

          # 在服务器本地执行：mc 导入桶 + 生成清单
          "${SSH_CMD[@]}" bash -s << 'REMOTE'
          set -euo pipefail
          chmod +x /tmp/publish-segmenter.sh
          /tmp/publish-segmenter.sh
          REMOTE

      - name: Deploy
        env:
          METHOD: ${{ steps.probe.outputs.method }}
          GHCR_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_REGISTRY_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          # 组装 SSH 命令（两种认证只在这里分叉，下面的远程脚本完全共用）
          #
          # ⚠ 必须带 ServerAliveInterval：这台服务器的 docker pull 可能跑几分钟，
          # 而链路上的中间设备（NAT/防火墙）会掐掉"长时间无数据"的连接。
          # 踩过的现场：pull 到 4 分 15 秒时 `client_loop: send disconnect: Broken pipe`，
          # exit 255 —— 看起来像部署失败，实际只是 SSH 空闲被断。
          # ServerAliveInterval=30 每 30 秒发一个保活包，让连接始终"有数据"。
          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=20
                    -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          if [ "$METHOD" = "key" ]; then
            SSH_CMD=(ssh -i ~/.ssh/deploy_key "${SSH_OPTS[@]}"
                     "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}")
          else
            SSH_CMD=(sshpass -p "$SSH_PASSWORD" ssh "${SSH_OPTS[@]}"
                     "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}")
          fi

          # ⚠ 变量传递：`ssh host bash -s << 'EOF'` 这种写法里，远程 shell 拿不到
          # 本地 env（GitHub Actions 的 env: 只注入到**本地**这一步的进程）。
          # 之前踩过：远程 `set -u` 直接报 `GHCR_TOKEN: unbound variable`。
          # 正确做法是把值作为**命令行参数**交给 `bash -s`（$1/$2/$3），
          # 而不是指望环境继承 —— ssh 默认不 SendEnv，且服务端 AcceptEnv 也未必开。
          #
          # 另一个细节：参数里可能有特殊字符（token），必须用单引号包住并转义，
          # 这里用 printf %q 生成安全的 shell 字面量。
          TOKEN_Q=$(printf '%q' "$GHCR_TOKEN")
          USER_Q=$(printf '%q' "$GHCR_USER")
          IMAGE_Q=$(printf '%q' "$IMAGE_REF")

          "${SSH_CMD[@]}" "bash -s -- $TOKEN_Q $USER_Q $IMAGE_Q" << 'REMOTE'
          set -euo pipefail
          GHCR_TOKEN="$1"
          GHCR_USER="$2"
          IMAGE_REF="$3"

          cd /opt/projectionroom

          # GHCR 登录：私有镜像必须。token 由 Actions 注入，不落盘。
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # —— 拉镜像：后台跑 + 轮询 ——
          #
          # 为什么不直接 `docker pull`：
          # 这台服务器拉镜像可能要 4~10 分钟（跨境链路），而**任何**前台阻塞都会
          # 让整条 SSH 会话暴露在"空闲超时"和"中间设备掐连接"之下。
          # 踩过两次：pull 到 4 分 15 秒时 Broken pipe，exit 255。
          #
          # 改成 nohup 后台拉 + 每 5 秒轮询一次完成标记。这样：
          #  - 单条 SSH 命令都是毫秒级，不存在长时间空闲；
          #  - 即使这条 SSH 断了，后台的 pull 仍在服务器上继续跑；
          #  - 重跑工作流时若镜像已在本地，`docker image inspect` 立刻返回，秒过。
          PULL_LOG=/tmp/pr-pull.log
          PULL_DONE=/tmp/pr-pull.done
          rm -f "$PULL_LOG" "$PULL_DONE"

          echo "后台拉取 $IMAGE_REF（日志 $PULL_LOG）"

          # 把拉取动作写成**独立脚本文件**再 nohup 执行。
          #
          # 为什么不用 `nohup bash -c "... \$? ..."`：那是三层引号嵌套
          # （Actions 的 run → ssh 的 heredoc → bash -c 的双引号），
          # 任何一层多一个或少一个反斜杠，`$?` 就会被提前展开成空串，
          # 结果是"完成标记文件存在但内容为空"——看起来拉取成功，
          # 实际无法判断退出码。写文件执行让每一层都只有一种引号语义。
          #
          # 为什么用 printf 而不是 `cat > file << 'EOF'`：
          # 这段代码本身就在一个 heredoc 里（REMOTE），再嵌一层 heredoc 时
          # 前导空格**不会被剥离**，`#!/bin/bash` 会变成"缩进的 shebang"
          # 从而失效（内核只认行首的 #!）。printf 逐行写没有这个问题。
          {
            printf '%s\n' '#!/bin/bash'
            printf '%s\n' '# $1=镜像引用 $2=日志路径 $3=完成标记路径'
            printf '%s\n' 'docker pull "$1" > "$2" 2>&1'
            printf '%s\n' 'rc=$?'
            printf '%s\n' 'printf "%s" "$rc" > "$3"'
          } > /tmp/pr-pull.sh
          chmod +x /tmp/pr-pull.sh

          nohup /tmp/pr-pull.sh "$IMAGE_REF" "$PULL_LOG" "$PULL_DONE" > /dev/null 2>&1 &

          # 最多等 15 分钟（180 × 5s）。超时按失败处理，但会打印日志尾部。
          for i in $(seq 1 180); do
            if [ -f "$PULL_DONE" ]; then
              RC=$(cat "$PULL_DONE")
              if [ "$RC" != "0" ]; then
                echo "拉取失败（exit=$RC），日志尾部："
                tail -30 "$PULL_LOG"
                exit 1
              fi
              echo "拉取完成（${i}×5s）"
              break
            fi
            # 每 12 次（1 分钟）打印一次进度，避免日志一片空白
            if [ $((i % 12)) -eq 0 ]; then
              echo "  …仍在拉取（$((i * 5))s），最近一行：$(tail -1 "$PULL_LOG" 2>/dev/null)"
            fi
            sleep 5
          done

          if [ ! -f "$PULL_DONE" ]; then
            echo "拉取超时（15 分钟），日志尾部："
            tail -30 "$PULL_LOG"
            exit 1
          fi

          # MinIO 的凭据在 /opt/minio/.env（root:600），compose 里用 ${MINIO_ROOT_*}
          # 引用。这里 source 一下再 up，否则 compose 会因变量缺失而报错。
          set -a; . /opt/minio/.env; set +a

          # 把镜像标签写进 .env，让下次手工 `docker compose up -d` 也用同一个版本
          # （避免"CI 部署了新版，手工重启又回到 latest"的漂移）。
          if grep -q '^IMAGE_REF=' .env; then
            sed -i "s|^IMAGE_REF=.*|IMAGE_REF=$IMAGE_REF|" .env
          else
            echo "IMAGE_REF=$IMAGE_REF" >> .env
          fi
          export IMAGE_REF

          # 用 up -d 而不是 down+up：down 会有几秒服务空窗。
          # 镜像变了 compose 会重建容器，没变则原地不动。
          docker compose up -d

          # 健康检查：不通过就失败。容器"起来了"不等于"服务是好的"。
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthz OK（${i}s）"
              echo "--- 当前容器 ---"
              docker ps --format '{{.Names}} | {{.Status}} | {{.Image}}'
              exit 0
            fi
            sleep 1
          done

          echo "healthz 超时未通过，输出最近日志："
          docker compose logs --tail 40
          exit 1
          REMOTE

      - name: Deployment summary
        if: always() && steps.probe.outcome == 'success'
        run: |
          {
            echo "### 部署结果"
            echo "- 镜像：\`${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}\`"
            echo "- 服务器：\`${{ env.SERVER_HOST }}\`"
            echo "- 认证：\`${{ steps.probe.outputs.method }}\`"
            echo "- 状态：\`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
