# GitHub Actions: Build & Push Docker Image to GHCR
#
# Prerequisites:
# 1. Personal Access Token with `write:packages` scope
# 2. Repository Secret: REGISTRY_TOKEN
#
# ⚠ 三个必须做对的点（都踩过）：
#  1. **Go 版本**必须与 go.mod 一致（1.26），否则 go mod download 直接失败；
#  2. **前端产物必须先构建**：Dockerfile 的 `COPY client/dist` 在 dist 不存在时会失败，
#     所以这里先跑 npm ci + npm run build；
#  3. 推送镜像要带 sha 标签，部署时才能按提交号精确回滚。

name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
    # 只忽略纯文档变更。⚠ 不要加 `.github/**` 或 Dockerfile 到忽略列表 ——
    # 改了构建配置却触发不了构建，是最容易让人以为"CI 坏了"的坑。
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override image tag (default: auto)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

# 同一分支的多次 push 只保留最后一次构建。
#
# cancel-in-progress: true 在这里是对的（与 deploy 相反）：
# 构建是幂等的纯产出动作，取消它不会留下中间态；
# 而两个构建同时跑会争抢同一个 `latest` 标签与 gha 缓存，
# 先完成的可能反而把 latest 指到旧代码上。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend (required by Dockerfile COPY client/dist)
        # ------------------------------------------------------------------
        # mock/real 适配层开关（client/src/api/mode.ts 的六个 VITE_MOCK_*）。
        #
        # ⚠ 这里的默认值与 mode.ts 的默认语义**刻意相反**，这不是笔误：
        #   · 本地开发不设变量 → mode.ts 判成 mock（前端先行的施工期要的正是这个）；
        #   · CI 不设仓库变量 → 这里回退成 '0' = **真实接口**。
        # 理由：2026-10-28 线上六个分区全显示同一份 mock 假数据，就是因为 CI
        # 什么都没设、静默沿用了 mode.ts 的"默认 mock"。生产走 mock 从来不是
        # 任何人的决定，只是"没人想起来配它" —— 而"忘了配"在两种默认下的后果
        # 完全不同：开发忘配 = 一切照常；生产忘配 = 所有人看到假的硬编码好友与消息。
        # 所以构建这一侧必须默认翻真，把"要不要 mock"变成**显式**动作。
        #
        # 想在某个环境退回 mock：仓库 Settings → Secrets and variables → Actions →
        # Variables 里把对应变量设成 1（六个独立设，支持逐域翻真）。
        # 判据：`npm run build` 之后看下一行打印的快照，别猜。
        env:
          VITE_MOCK_POSTS: ${{ vars.VITE_MOCK_POSTS || '0' }}
          VITE_MOCK_FRIENDS: ${{ vars.VITE_MOCK_FRIENDS || '0' }}
          VITE_MOCK_MESSAGES: ${{ vars.VITE_MOCK_MESSAGES || '0' }}
          VITE_MOCK_FORUM: ${{ vars.VITE_MOCK_FORUM || '0' }}
          VITE_MOCK_OFFICIAL: ${{ vars.VITE_MOCK_OFFICIAL || '0' }}
          VITE_MOCK_USERS: ${{ vars.VITE_MOCK_USERS || '0' }}
        run: |
          npm --prefix client ci
          npm --prefix client run build
          echo "本次构建的 mock 开关（0=真实接口，1=本地 mock）："
          env | grep '^VITE_MOCK_' | sort

      - name: Build segmenter binaries (cross-compiled, served by /downloads)
        run: |
          chmod +x scripts/build-segmenter.sh
          ./scripts/build-segmenter.sh

      # 把二进制作为 artifact 交给 deploy 工作流（后者在服务器本地导入 MinIO）。
      #
      # 这样绕开了"MinIO 只监听回环"的限制：runner 不需要连 MinIO，
      # 只需把文件交给 deploy，由它在服务器上执行 mc cp。
      - name: Upload segmenter artifacts for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: segmenter-binaries
          path: |
            client/dist/downloads/segmenter-*
          retention-days: 7
          if-no-files-found: error

      - name: Verify frontend output
        run: |
          test -f client/dist/index.html || (echo "client/dist/index.html missing" && exit 1)
          du -sh client/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag_override }},enable=${{ github.event.inputs.tag_override != '' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
