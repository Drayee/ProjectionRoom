# GitHub Actions: Build & Push Docker Image to GHCR
#
# Prerequisites:
# 1. Create Personal Access Token with `read:package` scope
# 2. Add as Repository Secret: GITHUB_REGISTRY_TOKEN
# 3. Server access configured via Secrets: SERVER_PASSWORD (SSH) or SSH_KEY_FILE
#
# Usage:
#   Triggered on push to main branch
#   Manual trigger also available: workflow_dispatch

name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override image tag (default: auto)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERFILE_PATH: ./Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_REGISTRY_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Default: sha short hash
            type=sha,prefix=
            # Latest on main branch
            type=edge
            # Release versions (tagged releases)
            type=ref,event=tag
            # Manual override from workflow_dispatch
            type=raw,value=${{ github.event.inputs.tag_override }},enable=${{ github.event.inputs.tag_override != '' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
